      - module: beginners-guide-obsidian
        optional: true
  - title: "Home base"
    when: "Weeks 1 to 2"
    steps:
      - module: obsidian-starter-kit
        note: "Builders who joined before 16 November 2026 have it. Joined later? It's sold on its own at https://store.dsebastien.net/osk, and it comes with Knowledge Master on the yearly or two-year plan."
