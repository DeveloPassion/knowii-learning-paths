        note: "Same rule as the kit above."
      - module: obsidian-automation-guide
        optional: true
        note: "Free. Part I now; the rest once the vault has run for a month."
  - title: "Habits and direction"
    when: "Weeks 3 to 6"
    steps:
      - module: journaling-deep-dive
        note: "The most transformative recording in the archive. Start here among the workshops."
