  The kit is the home base. To understand the thinking behind it, <a href="https://www.store.dsebastien.net/product/knowledge-management-for-beginners">Knowledge Management for Beginners</a> is the next step. To turn the daily note into a habit, the <a href="https://www.store.dsebastien.net/product/journaling-deep-dive">Journaling Deep Dive</a>. Both, plus the community, are in <a href="https://www.store.dsebastien.net/product/knowii-community">Knowii</a>.
